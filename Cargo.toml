[package]
name = "nano-mockidp"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Lightweight mock OpenID Connect provider for dev and CI"
repository = "https://github.com/Kapernikov/nano-mockidp"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "form", "query"] }
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
base64 = "0.22"
url = "2"
serde_urlencoded = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"], default-features = false }
jsonwebtoken = "9"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
