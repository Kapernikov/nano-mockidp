<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nano-mockidp — Sign in</title>
<style>
  :root {
    --kpv-primary: #ba2415;
    --kpv-primary-dark: #901c1d;
    --kpv-dark-grey: #484847;
    --kpv-medium-grey: #818281;
    --kpv-light-grey: #bfc0c0;
    --kpv-very-light-grey: #ececec;
    --kpv-beige: #e2d7cd;
    --bg: #f5f2ee;
    --card: #ffffff;
    --text: #222221;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px;
  }
  .card {
    background: var(--card);
    width: 100%;
    max-width: 480px;
    border-top: 6px solid var(--kpv-primary);
    box-shadow: 0 8px 30px rgba(34,34,33,.08);
    padding: 28px 32px 32px;
  }
  .logo { width: 220px; height: auto; display: block; margin: 0 0 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--kpv-medium-grey); margin: 0 0 20px; font-size: 13px; }
  .ctx {
    font-size: 12px; color: var(--kpv-dark-grey);
    background: var(--kpv-very-light-grey); border-left: 3px solid var(--kpv-beige);
    padding: 8px 12px; margin: 0 0 20px; word-break: break-all;
  }
  .ctx b { color: var(--kpv-medium-grey); font-weight: 500; }
  .ctx div + div { margin-top: 2px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--kpv-dark-grey); margin: 14px 0 4px; letter-spacing: .02em; text-transform: uppercase; }
  input, textarea {
    width: 100%; font: inherit; color: var(--text);
    border: 1px solid var(--kpv-light-grey); border-radius: 3px;
    padding: 9px 11px; background: #fff;
  }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; min-height: 120px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--kpv-primary); box-shadow: 0 0 0 3px rgba(186,36,21,.12); }
  .hint { font-size: 12px; color: var(--kpv-medium-grey); margin: 4px 0 0; }
  button {
    margin-top: 22px; width: 100%; font: inherit; font-weight: 600;
    background: var(--kpv-primary); color: #fff; border: 0; border-radius: 3px;
    padding: 11px 16px; cursor: pointer;
  }
  button:hover { background: var(--kpv-primary-dark); }
  .foot { margin-top: 18px; font-size: 11px; color: var(--kpv-light-grey); text-align: center; }
</style>
</head>
<body>
  <main class="card">
    <svg class="logo" role="img" aria-label="Kapernikov" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444.07 67.87"><defs><style>.kl1{fill:#b9381f;}.kl2{fill:#fff;}.kl3{fill:#222221;}</style></defs><g id="Layer_2" data-name="Layer 2"><g id="Layer_1-2" data-name="Layer 1"><path class="kl1" d="M33.94,0A33.94,33.94,0,1,0,67.87,33.94,33.94,33.94,0,0,0,33.94,0Z"/><polygon class="kl2" points="51.07 26.52 40.03 26.52 35.66 30.84 51.07 41.16 51.07 50.62 30.33 35.93 16.8 49.32 16.8 39.91 31.01 26.52 16.8 26.52 16.8 18.98 51.07 18.98 51.07 26.52"/><path class="kl3" d="M148.13,50.6,145.66,44H135.29l-2.42,6.57h-7.21l12.4-31.77h5.29l12.4,31.77Zm-6.62-18.68a31.42,31.42,0,0,1-1-3.21h-.1a22.57,22.57,0,0,1-1,3.21l-2.27,6.32h6.62Z"/><path class="kl3" d="M179.4,38.2h-4.2V50.6h-7.36V19.08H179.4c5.44,0,10.18,3.61,10.18,9.54S184.84,38.2,179.4,38.2Zm-1.09-13.09H175.2v7.06h3.11c2,0,4-1.09,4-3.56S180.29,25.11,178.31,25.11Z"/><path class="kl3" d="M200,50.6V19.08h18.38v6.27H207.66v6.27h8.74V38h-8.74v6.32h12.1V50.6Z"/><path class="kl3" d="M251.92,50.6l-8.5-12.4h-2.72V50.6h-7.36V19.08H245.1c5.39,0,10.18,3.61,10.18,9.54a8.68,8.68,0,0,1-4.84,7.9l10,14.08Zm-8-25.49h-3.26v7.06H244c2,0,4-1.09,4-3.56S245.94,25.11,244,25.11Z"/><path class="kl3" d="M296.78,50.94,284.53,37.51c-2-2.17-4.2-4.84-5.88-6.92l-.1,0c.1,2.22.15,4.64.15,6.62V50.6H271V19.08h6.18l10.67,11.76c1.48,1.63,3.71,4.2,5.14,6l.1,0c-.1-1.88-.15-3.9-.15-5.88V19.08h7.66V50.94Z"/><path class="kl3" d="M316.44,50.6V19.08h7.66V50.6Z"/><path class="kl3" d="M390.32,51.34c-8.7,0-16.95-6.37-16.95-16.55s8.25-16.45,16.95-16.45,17,6.37,17,16.45S399.07,51.34,390.32,51.34Zm0-26.28a9.36,9.36,0,0,0-9.19,9.73c0,5.93,4.45,9.78,9.19,9.78a9.42,9.42,0,0,0,9.24-9.78A9.4,9.4,0,0,0,390.32,25.05Z"/><path class="kl3" d="M432.61,50.79h-6.27L414.83,19.08h7.85L427.62,33c.74,2.08,1.48,4.64,2.08,7h.1c.59-2.37,1.33-4.94,2.07-7l4.94-13.88h7.26Z"/><polygon class="kl3" points="104.69 32.43 116.33 19.01 107.63 19.03 97.78 30.56 97.78 18.98 90.12 18.98 90.12 50.6 90.15 50.6 97.78 50.6 97.78 39.88 100.06 37.33 108.67 50.6 116.96 50.6 104.69 32.43"/><polygon class="kl3" points="353.76 32.43 365.39 19.01 356.7 19.03 346.84 30.56 346.84 18.98 339.18 18.98 339.18 50.6 339.22 50.6 346.84 50.6 346.84 39.88 349.12 37.33 357.74 50.6 366.02 50.6 353.76 32.43"/></g></g></svg>
    <h1>Mock sign-in</h1>
    <p class="sub">nano-mockidp — any username works, claims are taken as-is.</p>
    <div class="ctx" id="ctx" hidden></div>
    <form method="post">
      <label for="username">Username (sub)</label>
      <input id="username" name="username" autocomplete="off" autofocus value="testuser" required>
      <label for="claims">Extra claims (JSON)</label>
      <textarea id="claims" name="claims" spellcheck="false">{"email": "user@example.com", "name": "Test User"}</textarea>
      <p class="hint">Merged into the tokens. May override <code>sub</code>, <code>aud</code>, anything except <code>iss</code>/<code>exp</code>/<code>iat</code>/<code>jti</code>.</p>
      <label for="expires_in">Token lifetime override (seconds, optional)</label>
      <input id="expires_in" name="expires_in" inputmode="numeric" pattern="[0-9]*" placeholder="default">
      <button type="submit">Sign in</button>
    </form>
    <p class="foot">nano-mockidp · not a real identity provider</p>
  </main>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var rows = [];
      ["client_id", "scope", "redirect_uri"].forEach(function (k) {
        if (p.get(k)) {
          var d = document.createElement("div");
          var b = document.createElement("b"); b.textContent = k + ": ";
          d.appendChild(b); d.appendChild(document.createTextNode(p.get(k)));
          rows.push(d);
        }
      });
      if (rows.length) {
        var c = document.getElementById("ctx");
        rows.forEach(function (r) { c.appendChild(r); });
        c.hidden = false;
      }
    })();
  </script>
</body>
</html>
